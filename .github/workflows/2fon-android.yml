name: Build 2FON Android APK
on:
  push:
    branches: [arena/1a367ab6-meu-negocio]
    paths: ['2fon/**', '.github/workflows/2fon-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2fon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 2fon/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - run: npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: 2fon/android
      - uses: actions/upload-artifact@v4
        with:
          name: 2FON-Android-APK
          path: 2fon/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Transfer the requested APK back to the session through this same branch.
      # It is removed from Git after retrieval; the user keeps the download.
      - name: Transfer APK to session branch
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 2FON-temporary.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2FON-temporary.apk
          git commit -m "Temporary APK transfer"
          git push origin HEAD:arena/1a367ab6-meu-negocio
