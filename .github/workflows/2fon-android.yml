name: Build 2FON Android APK
on:
  push:
    branches: [arena/1a367ab6-meu-negocio]
    paths: ['2fon/**', '.github/workflows/2fon-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2fon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 2fon/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - run: npx tsc src/lyrics.ts --target es2022 --module commonjs --outDir /tmp/2fon-tests --skipLibCheck && node tests/lyrics.cjs /tmp/2fon-tests/lyrics.js
      - run: npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: 2fon/android
      - uses: actions/upload-artifact@v4
        with:
          name: 2FON-Android-APK
          path: 2fon/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install 2fon/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.twofon.player/.MainActivity
            adb shell pidof com.twofon.player
      - name: Update requested APK on session branch
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 2FON.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2FON.apk
          git commit -m "Update 2FON APK"
          git push origin HEAD:arena/1a367ab6-meu-negocio
