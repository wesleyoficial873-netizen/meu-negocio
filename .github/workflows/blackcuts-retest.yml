name: Reteste de exclusão BLACKCUTS
on:
  push:
    paths: ['blackcuts-music-player/tools/emulator-smoke.sh', '.github/workflows/blackcuts-retest.yml']
permissions:
  actions: read
  contents: read
jobs:
  retest:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 29]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download APK compilado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.apk_run_id }}" --repo "$GITHUB_REPOSITORY" --name blackcuts-debug-apk --dir /tmp/blackcuts-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: blackcuts-music-player/tools/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackcuts-retest-${{ matrix.api }}
          path: |
            /tmp/blackcuts-*window.xml
            /tmp/blackcuts-after-delete.xml
            /tmp/blackcuts-logcat.txt
          if-no-files-found: ignore
