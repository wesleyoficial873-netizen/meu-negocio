name: Diagnóstico de testes BLACKCUTS
on:
  push:
    paths: ['.github/workflows/blackcuts-ci-diagnostics.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Ler falhas de emulador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44916684633 --repo "$GITHUB_REPOSITORY" --name blackcuts-retest-29 --dir /tmp/diag29 || true
          gh run download 44916684633 --repo "$GITHUB_REPOSITORY" --name blackcuts-retest-28 --dir /tmp/diag28 || true
          gh run view 44916684633 --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/falhas.txt || true
          python3 - <<'PY'
          import re
          text=open('/tmp/falhas.txt',errors='replace').read().splitlines()
          import glob,xml.etree.ElementTree as ET
          for path in glob.glob('/tmp/diag*/*window.xml') + glob.glob('/tmp/diag*/blackcuts-after-delete.xml'):
              try:
                  root=ET.parse(path)
                  labels=[(n.attrib.get('text',''),n.attrib.get('content-desc','')) for n in root.iter() if n.attrib.get('text') or n.attrib.get('content-desc')]
                  print('::notice::'+path+': '+str(labels).replace('%','%25').replace('\n','%0A'))
              except Exception as exc: print('::notice::'+path+': '+str(exc))
          for path in glob.glob('/tmp/diag*/blackcuts-logcat.txt'):
              lines=open(path,errors='replace').read().splitlines()
              selected=[line for line in lines if 'blackcuts' in line.lower() or 'MediaProvider' in line or 'RecoverableSecurityException' in line or 'Exception' in line]
              value=('\n'.join(selected[-30:])).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice::'+path+' '+value)
          for name in ('retest (28)', 'retest (29)'):
              lines=[line for line in text if line.startswith(name+'\tRun reactivecircus')]
              end=next((i for i,line in enumerate(lines) if 'Script exited with' in line or 'Error: The process' in line), len(lines))
              excerpt=lines[max(0,end-35):min(len(lines),end+3)]
              value='\n'.join(excerpt).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice::'+value)
          PY
