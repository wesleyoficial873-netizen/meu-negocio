name: Test 2FON on Android 16
on:
  push:
    branches: [arena/1a367ab6-meu-negocio]
    paths: ['2fon/2FON.apk', '2fon/tests/android-smoke.cjs', '.github/workflows/2fon-android16-test.yml']
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package signature
        run: |
          SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$SDK/apksigner" verify --verbose 2fon/2FON.apk
      - name: Create local audio fixture
        run: |
          python3 - <<'PY'
          import wave, math, struct
          with wave.open('/tmp/2fon-test.wav','wb') as f:
              f.setparams((2,2,44100,0,'NONE','not compressed'))
              for i in range(44100*15):
                  sample=int(7000*math.sin(i*2*math.pi*440/44100))
                  f.writeframesraw(struct.pack('<hh',sample,sample))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install 2fon/2FON.apk
            adb shell pm grant com.twofon.player android.permission.READ_MEDIA_AUDIO
            adb push /tmp/2fon-test.wav /sdcard/Music/2fon-test.wav
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Music/2fon-test.wav
            sleep 5
            adb shell am start -W -n com.twofon.player/.MainActivity
            pid=$(adb shell pidof com.twofon.player | tr -d '\r')
            adb forward tcp:9222 localabstract:webview_devtools_remote_$pid
            node 2fon/tests/android-smoke.cjs
