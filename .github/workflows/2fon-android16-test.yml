name: Test 2FON on Android 16
on:
  push:
    branches: [arena/1a367ab6-meu-negocio]
    paths: ['2fon/2FON.apk', '.github/workflows/2fon-android16-test.yml']
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify package signature
        run: |
          SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$SDK/apksigner" verify --verbose 2fon/2FON.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install 2fon/2FON.apk
            adb shell am start -W -n com.twofon.player/.MainActivity
            sleep 10
            echo "::notice title=Process::$(adb shell pidof com.twofon.player || true)"
            echo "::notice title=Runtime::$(adb logcat -d -t 2000 -s AndroidRuntime:E | tr '\n' ' ' | cut -c1-8000)"
            echo "::notice title=Activity::$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tr '\n' ' ' || true)"
            adb shell pidof com.twofon.player
