name: Test 2FON on Android 16
on:
  push:
    branches: [arena/1a367ab6-meu-negocio]
    paths: ['.github/workflows/2fon-android16-test.yml']
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover exact APK delivered to user
        run: git show 5d19c84:2fon/2FON-temporary.apk > "$RUNNER_TEMP/2FON.apk"
      - name: Verify package
        run: |
          SDK="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$SDK/apksigner" verify --verbose "$RUNNER_TEMP/2FON.apk"
          "$SDK/aapt" dump badging "$RUNNER_TEMP/2FON.apk" | head -10
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            out=$(adb install "$RUNNER_TEMP/2FON.apk" 2>&1) || { echo "::error title=APK installation failed::$out"; exit 1; }
            echo "::notice title=APK installation::$out"
            adb shell am start -W -n com.twofon.player/.MainActivity || exit 1
            adb shell pidof com.twofon.player || { echo "::error::App did not remain running"; exit 1; }
