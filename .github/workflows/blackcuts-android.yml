name: BLACKCUTS Android
on:
  push:
    paths: ['blackcuts-music-player/**', '.github/workflows/blackcuts-android.yml']
  pull_request:
    paths: ['blackcuts-music-player/**', '.github/workflows/blackcuts-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: blackcuts-music-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || { echo "::error::Android SDK platform 35 missing"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || { echo "::error::Android build tools 35 missing"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee /tmp/blackcuts-build.log || { tail -70 /tmp/blackcuts-build.log | while IFS= read -r line; do echo "::error::$line"; done; exit 1; }
      - name: Verify debug APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blackcuts-debug-apk
          path: |
            blackcuts-music-player/app/build/outputs/apk/debug/app-debug.apk
            blackcuts-music-player/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: blackcuts-release-unsigned
          path: blackcuts-music-player/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackcuts-test-reports
          path: blackcuts-music-player/app/build/reports/tests/
          if-no-files-found: ignore
  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: blackcuts-debug-apk
          path: /tmp/blackcuts-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: blackcuts-music-player/tools/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackcuts-emulator-diagnostics
          path: |
            /tmp/blackcuts-window.xml
            /tmp/blackcuts-media-session.txt
          if-no-files-found: ignore
